<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>검색 성적표</title>
<style>:root{--paper:#FBF8F1;--card:#FFFDF9;--line:#E4DDCF;--ink:#1B1F1D;--muted:#5E665F;--faint:#7C857F;--green:#1E5C46;--gold:#B8862B;--red:#B8382D;--soft:#F3F0E7;--bar:#2E7D5B;--naver:#2E9E5B;--google:#3B78D8;--direct:#8AA3B8;--etc:#C9A46A;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#141614;--card:#1C1F1D;--line:#30352F;--ink:#ECEEE9;--muted:#B3BAB3;--faint:#8D958E;--green:#6FCF9F;--gold:#E0B25A;--red:#F08A7E;--soft:#232723;--bar:#5DBB8C;--naver:#4CC47C;--google:#6FA3F2;--direct:#7F95A8;--etc:#C9A46A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.55;font-size:15px}
.app{max-width:1080px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
a{color:var(--green)}
[hidden]{display:none!important}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--green);color:var(--paper);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.meta{font-size:12.5px;color:var(--faint);margin:10px 0 0}
.note{font-size:12px;color:var(--faint);margin:8px 0 0}
.box{margin:12px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.box b{display:block}.box p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.box.warn{border-color:var(--gold)}
.lock{margin-top:14px;max-width:420px}
.lock label{display:block;font-weight:700;font-size:14px}
.lock .row{display:flex;gap:8px;margin-top:8px}
.lock input[type=password]{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.lock .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:400;font-size:14px;color:var(--muted)}
.lock .chk input{width:18px;height:18px}
.err{margin:10px 0 0;color:var(--red);font-size:14px;font-weight:700}
.jump{display:flex;gap:6px;overflow-x:auto;margin:12px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.jump a{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font-size:13px;text-decoration:none}
.sec{margin-top:26px;scroll-margin-top:10px}
.sec h2{font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small,h3 small{font-size:12px;font-weight:400;color:var(--faint)}
.grp{font-size:14px;margin:16px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:10px}
.site h3{margin:0 0 8px;font-size:16px;display:flex;align-items:baseline;gap:8px}
.site h3 a{color:var(--ink);text-decoration:none}
.none{margin:0;color:var(--faint);font-size:13.5px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.k{background:var(--soft);border-radius:10px;padding:8px 9px;min-width:0}
.k .lb{display:block;font-size:11.5px;color:var(--faint)}
.k b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.k .pv{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{font-size:11px;margin-left:4px;color:var(--faint);white-space:nowrap}
.k>.dl{display:inline-block}
.up{color:var(--green)}.down{color:var(--red)}
.total .k b{font-size:23px}
.chart{margin-top:10px}
.chart svg{display:block;width:100%;height:44px}
.chart .b{fill:var(--bar)}.chart .h{fill:transparent}
.chart g.on .b{fill:var(--gold)}.chart g.on .h{fill:var(--soft)}
.ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:2px}
.read{margin:4px 0 0;font-size:11.5px;color:var(--muted);min-height:1.5em}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 4px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.s-naver{background:var(--naver)}.s-google{background:var(--google)}.s-direct{background:var(--direct)}.s-etc{background:var(--etc)}
.srow{padding:9px 0;border-top:1px dashed var(--line)}
.sn{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.sn span{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sbar{display:flex;gap:2px;height:12px;margin-top:5px;border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;min-width:2px}
.st{margin:4px 0 0;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:var(--paper);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--faint);font-size:11.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.rk{display:inline-block;min-width:1.5em;color:var(--faint);font-size:11.5px}
td .p{display:block;margin-left:1.5em;font-size:11px;color:var(--faint);overflow-wrap:anywhere}
.sub{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
.ctx{margin:0 0 4px;padding:9px 11px;background:var(--soft);border-radius:8px;font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
table.g td{vertical-align:middle;white-space:nowrap}
.sp{width:96px;text-align:right}
.spark{width:96px;height:24px;display:block;margin-left:auto}
.spark polyline{fill:none;stroke:var(--faint);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.status{list-style:none;margin:0;padding:4px 14px}
.status li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.status li:last-child{border-bottom:0}
.status b{flex:none;width:7.5em;padding-left:14px;position:relative}
.status b::before{content:'';position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status .good b::before{background:var(--naver)}.status .bad b::before{background:var(--red)}.status .warn b::before{background:var(--gold)}
.status span{color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.links a{display:block;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none}
.links b{display:block;color:var(--ink);font-size:14px}.links span{font-size:12px;color:var(--faint)}
@media (min-width:720px){.app{padding:22px 20px 60px}.k b{font-size:21px}}</style>
</head>
<body>
<div class="app">
<header><h1>검색 성적표</h1><button class="btn ghost sm" id="sb-lockbtn" type="button" hidden>잠그기</button></header>
<div id="sb-lock">
<p class="meta">운영자용 요약입니다. 비밀번호를 넣어야 열립니다.</p>
<form id="sb-form" class="lock card" autocomplete="on">
<label for="sb-pw">관리자 비밀번호</label>
<div class="row"><input id="sb-pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required aria-describedby="sb-err"><button class="btn" id="sb-open" type="submit">열기</button></div>
<label class="chk"><input id="sb-rem" type="checkbox"> 이 기기에서 기억</label>
<p class="err" id="sb-err" role="alert" hidden></p>
<p class="note">기억을 켜지 않으면 이 탭을 닫을 때까지만 열려 있어요. 켜면 이 기기에서는 비밀번호를 바꿀 때까지 다시 묻지 않아요(비밀번호가 아니라 풀이 열쇠만 저장). 같이 쓰는 기기에서는 켜지 마세요.</p>
</form>
<noscript><div class="box warn"><b>자바스크립트가 꺼져 있어요</b><p>이 페이지는 브라우저에서 암호를 풀어 보여 주므로 자바스크립트가 필요합니다.</p></div></noscript>
</div>

document.querySelectorAll('.chips').forEach(function(w){w.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;w.querySelectorAll('.chip').forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');var p=document.getElementById(x.getAttribute('data-tab'));if(p)p.hidden=!on})})})}
(function(){var P=JSON.parse(document.getElementById('sb-data').textContent),K='seo-board-key',S=window.crypto&&window.crypto.subtle,
lock=document.getElementById('sb-lock'),form=document.getElementById('sb-form'),pw=document.getElementById('sb-pw'),rem=document.getElementById('sb-rem'),err=document.getElementById('sb-err'),btn=document.getElementById('sb-open'),root=document.getElementById('sb-root'),bar=document.getElementById('sb-lockbtn');
function b2u(s){var b=atob(s),u=new Uint8Array(b.length),i=0;for(;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function u2b(u){var s='',i=0;for(;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function forget(){['sessionStorage','localStorage'].forEach(function(n){try{window[n].removeItem(K)}catch(e){}})}
function saved(){var n=['sessionStorage','localStorage'],i=0,v;for(;i<2;i++){try{v=window[n[i]].getItem(K);if(v)return v}catch(e){}}return ''}
function keep(raw){forget();try{window[rem.checked?'localStorage':'sessionStorage'].setItem(K,P.salt+':'+u2b(raw))}catch(e){}}
function fail(m){err.textContent=m;err.hidden=false;pw.setAttribute('aria-invalid','true')}
function busy(on){btn.disabled=on;btn.textContent=on?'여는 중…':'열기'}
function derive(pass){return S.importKey('raw',new TextEncoder().encode(pass.normalize('NFC')),'PBKDF2',false,['deriveBits']).then(function(k){return S.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b2u(P.salt),iterations:P.iter},k,256)}).then(function(b){return new Uint8Array(b)})}
function open(raw){return S.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']).then(function(k){return S.decrypt({name:'AES-GCM',iv:b2u(P.iv)},k,b2u(P.ct))}).then(function(b){return new TextDecoder().decode(b)})}
function show(html){root.innerHTML=html;root.hidden=false;lock.hidden=true;bar.hidden=false;pw.value='';err.hidden=true;pw.removeAttribute('aria-invalid');sbInit();var t=location.hash.length>1&&document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView()}
bar.addEventListener('click',function(){forget();root.innerHTML='';root.hidden=true;bar.hidden=true;lock.hidden=false;rem.checked=false;pw.focus()});
if(!S||!window.TextEncoder){fail('이 브라우저(또는 http 주소)에서는 열 수 없어요. https 주소로, 최신 브라우저에서 열어 주세요.');btn.disabled=true;return}
form.addEventListener('submit',function(e){e.preventDefault();if(btn.disabled)return;var pass=pw.value;if(!pass){fail('비밀번호를 넣어 주세요');pw.focus();return}busy(true);err.hidden=true;
derive(pass).then(function(raw){return open(raw).then(function(html){keep(raw);show(html)})}).catch(function(){fail('비밀번호가 맞지 않아요');pw.focus();pw.select()}).then(function(){busy(false)})});
var s=saved(),i=s.indexOf(':');if(s){if(s.slice(0,i)!==P.salt)forget();else{var raw;try{raw=b2u(s.slice(i+1))}catch(e){forget()}if(raw)open(raw).then(show).catch(forget)}}})();</script>
</body>
</html>
